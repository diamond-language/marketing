# /etc/nginx/conf.d/dilang.conf; shared TLS/ACME settings stay in 00-common.conf.
# Issue the getdiamond.codes certificate before installing this configuration.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getdiamond.codes;
    ssl_certificate /etc/letsencrypt/live/getdiamond.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getdiamond.codes/privkey.pem;

    root /var/www/dilang.tech;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain text/xml;
    location = /wasm/ {
        return 301 "/#repl";
    }
    location / {
        # Without this, browsers cache css/js/wasm heuristically for days, and a
        # deploy shows new HTML with stale styles and an old REPL module.
        # no-cache = revalidate each time (304 via ETag when unchanged).
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dilang.tech;
    ssl_certificate /etc/letsencrypt/live/dilang.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dilang.tech/privkey.pem;
    return 301 https://getdiamond.codes$request_uri;
}
